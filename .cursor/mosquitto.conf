# Mosquitto config for the Cloud Agent dev environment.
# Local, single-host development broker: anonymous access on the loopback network.
listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

allow_anonymous true
persistence false

log_dest file /tmp/smarthome-mosquitto.log
log_type warning
log_type error
log_type notice
