# Mosquitto MQTT Broker Konfiguration

listener 1883
protocol mqtt

listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# Für lokales Netzwerk ohne Authentifizierung (Phase 1-3)
# Im Produktivbetrieb allow_anonymous false + Passwortdatei setzen
allow_anonymous true

# Maximale Verbindungen
max_connections -1
