# Laravel API via php-fpm auf Port 8000 (ersetzt `artisan serve`)
# Install: sudo cp deploy/smarthome-api-php-fpm.conf /etc/nginx/sites-available/smarthome-api
#          sudo ln -sf /etc/nginx/sites-available/smarthome-api /etc/nginx/sites-enabled/smarthome-api
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8000;
    listen [::]:8000;
    server_name _;

    root /home/pi/SmartHome/backend/public;
    index index.php;

    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm-smarthome.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_read_timeout 60;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
