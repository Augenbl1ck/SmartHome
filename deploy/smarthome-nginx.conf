# nginx Konfiguration für SmartHome auf dem Raspberry Pi
# Installieren: sudo cp smarthome-nginx.conf /etc/nginx/sites-available/smarthome
#               sudo ln -s /etc/nginx/sites-available/smarthome /etc/nginx/sites-enabled/
#               sudo nginx -t && sudo systemctl reload nginx

# ═══════════════════════════════════════════════════════════════
# HTTP (Port 80) - Für lokalen Zugriff im Heimnetz
# ═══════════════════════════════════════════════════════════════
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;  # Alle Hostnamen / IPs (smarthome.local, 192.168.1.220, etc.)

    # ── Frontend (Next.js auf Port 3000) ─────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Backend API (Laravel auf Port 8000) ──────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30;
    }

    # ── Reverb WebSocket (Port 6001) ─────────────────────────────
    location /app/ {
        proxy_pass         http://127.0.0.1:6001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 60;
    }

    location /apps/ {
        proxy_pass         http://127.0.0.1:6001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 60;
    }

    # ── Service Worker + statische Dateien ───────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|webp)$ {
        proxy_pass       http://127.0.0.1:3000;
        expires          7d;
        add_header       Cache-Control "public, immutable";
    }

    # ── Gzip ─────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 256;
}

# ═══════════════════════════════════════════════════════════════
# HTTPS (Port 443) - Für Tailscale-Zugriff von außen
# ═══════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name smarthome.taile4b6ab.ts.net;

    # SSL-Zertifikate von Tailscale
    ssl_certificate     /etc/ssl/certs/smarthome.taile4b6ab.ts.net.crt;
    ssl_certificate_key /etc/ssl/private/smarthome.taile4b6ab.ts.net.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Frontend (Next.js auf Port 3000) ─────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Backend API (Laravel auf Port 8000) ──────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30;
    }

    # ── Reverb WebSocket (Port 6001) ─────────────────────────────
    location /app/ {
        proxy_pass         http://127.0.0.1:6001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60;
    }

    location /apps/ {
        proxy_pass         http://127.0.0.1:6001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60;
    }

    # ── Service Worker + statische Dateien ───────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|webp)$ {
        proxy_pass       http://127.0.0.1:3000;
        expires          7d;
        add_header       Cache-Control "public, immutable";
    }

    # ── Gzip ─────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 256;
}
