; SmartHome Laravel php-fpm Pool
; Install: sudo cp deploy/php8.4-fpm-smarthome.conf /etc/php/8.4/fpm/pool.d/smarthome.conf
;          sudo systemctl enable --now php8.4-fpm && sudo systemctl restart php8.4-fpm

[smarthome]
user = pi
group = pi
listen = /run/php/php8.4-fpm-smarthome.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 10s
pm.max_requests = 200

chdir = /
catch_workers_output = yes
php_admin_value[error_log] = /home/pi/SmartHome/backend/storage/logs/php-fpm.log
php_admin_flag[log_errors] = on
