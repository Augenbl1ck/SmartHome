<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartHome</title>
  <style>
    body { margin: 0; min-height: 100vh; font-family: sans-serif; background: #e8edf5; color: #18181b; padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box; }
    main { max-width: 28rem; margin: 0 auto; padding: 1.5rem; }
    h1 { font-size: 1.25rem; margin: 0 0 0.75rem; }
    label { display: block; font-size: 0.875rem; margin: 0.75rem 0 0.5rem; }
    input, button { font: inherit; min-height: 2.75rem; border-radius: 0.75rem; }
    input { width: 100%; box-sizing: border-box; padding: 0 0.75rem; border: 1px solid #d4d4d8; }
    button { margin-top: 0.75rem; border: 0; padding: 0 1rem; background: #2563eb; color: white; }
    .card { background: white; border-radius: 1rem; padding: 1.25rem; }
    #status { font-size: 0.875rem; margin: 0.75rem 0 0; }
    #loading { min-height: 70vh; display: none; align-items: center; justify-content: center; }
    #loading.on { display: flex; }
    #form { display: none; }
    #form.on { display: block; }
    .spin {
      width: 2.75rem;
      height: 2.75rem;
      border: 3px solid #d4d4d8;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: turn 0.8s linear infinite;
    }
    @keyframes turn { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <div id="loading" class="on">
      <div class="spin" role="status" aria-label="Verbinden"></div>
    </div>
    <form class="card" id="form">
      <h1>Adresse</h1>
      <label for="home">Zu Hause, im WLAN</label>
      <input id="home" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
      <label for="away">Unterwegs, über Tailscale</label>
      <input id="away" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
      <p id="status"></p>
      <button type="submit">Öffnen</button>
    </form>
  </main>
  <script>
    var HOME = 'smarthome_home';
    var AWAY = 'smarthome_away';
    var OLD = 'smarthome_server';
    var form = document.getElementById('form');
    var loading = document.getElementById('loading');
    var homeInput = document.getElementById('home');
    var awayInput = document.getElementById('away');
    var statusNode = document.getElementById('status');
    var store = window.Capacitor && Capacitor.registerPlugin
      ? Capacitor.registerPlugin('Preferences')
      : null;

    function showForm(message) {
      loading.classList.remove('on');
      form.classList.add('on');
      statusNode.textContent = message || '';
    }

    function showLoading() {
      form.classList.remove('on');
      loading.classList.add('on');
    }

    function normalize(value) {
      value = (value || '').trim().replace(/\/$/, '');
      if (!value) return '';
      if (!/^https?:\/\//i.test(value)) value = 'http://' + value;
      return value;
    }

    function strip(value) {
      return (value || '').replace(/^https?:\/\//i, '');
    }

    async function readKey(key) {
      if (store) {
        try {
          var saved = await store.get({ key: key });
          if (saved && saved.value) return saved.value;
        } catch (e) {}
      }
      return localStorage.getItem(key) || '';
    }

    async function writeKey(key, value) {
      if (value) localStorage.setItem(key, value);
      else localStorage.removeItem(key);
      if (!store) return;
      try {
        if (value) await store.set({ key: key, value: value });
        else await store.remove({ key: key });
      } catch (e) {}
    }

    function reachable(url) {
      return new Promise(function (resolve) {
        var done = false;
        var timer = setTimeout(function () { finish(false); }, 4000);
        function finish(ok) {
          if (done) return;
          done = true;
          clearTimeout(timer);
          resolve(ok);
        }
        try {
          fetch(url, { mode: 'no-cors', cache: 'no-store' })
            .then(function () { finish(true); })
            .catch(function () { finish(false); });
        } catch (e) {
          finish(false);
        }
      });
    }

    async function choose(home, away) {
      showLoading();
      if (home && await reachable(home)) {
        location.replace(home);
        return;
      }
      if (away && await reachable(away)) {
        location.replace(away);
        return;
      }
      homeInput.value = strip(home);
      awayInput.value = strip(away);
      showForm('Keine der Adressen ist erreichbar.');
    }

    async function boot() {
      var legacy = await readKey(OLD);
      var home = await readKey(HOME);
      var away = await readKey(AWAY);
      if (!home && legacy) home = legacy;
      if (home) await writeKey(HOME, home);
      if (away) await writeKey(AWAY, away);
      if (home || away) {
        choose(home, away);
        return;
      }
      showForm('');
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      var home = normalize(homeInput.value);
      var away = normalize(awayInput.value);
      if (!home && !away) {
        showForm('Mindestens eine Adresse eintragen.');
        return;
      }
      Promise.all([writeKey(HOME, home), writeKey(AWAY, away)]).then(function () {
        choose(home, away);
      });
    });

    boot();
  </script>
</body>
</html>
